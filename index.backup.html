<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Smooth Scroll Animation</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html, body {
      width: 100%;
      min-height: 100%;
      background-color: #0b0b0d;
      overflow-x: hidden;
      scrollbar-width: thin;
      scrollbar-color: rgba(255, 255, 255, 0.2) transparent;
    }

    /* Custom smooth scrollbar */
    ::-webkit-scrollbar {
      width: 6px;
    }
    ::-webkit-scrollbar-track {
      background: transparent;
    }
    ::-webkit-scrollbar-thumb {
      background: rgba(255, 255, 255, 0.2);
      border-radius: 3px;
    }
    ::-webkit-scrollbar-thumb:hover {
      background: rgba(255, 255, 255, 0.4);
    }

    /* Canvas fixed to viewport */
    #canvas {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      display: block;
      pointer-events: none;
      z-index: 1;
      image-rendering: -webkit-optimize-contrast;
      image-rendering: high-quality;
    }

    /* Scroll container providing the scrub timeline */
    #scroll-track {
      height: 500vh;
      width: 100%;
      position: relative;
    }
  </style>
</head>
<body>
  <canvas id="canvas"></canvas>
  <div id="scroll-track"></div>

  <script>
    (function () {
      const canvas = document.getElementById('canvas');
      const ctx = canvas.getContext('2d', { alpha: false, desynchronized: true });
      
      const FRAME_COUNT = 300;
      const images = new Array(FRAME_COUNT);
      let loadedImagesCount = 0;
      let currentFrameIndex = 0;
      let targetFrameIndex = 0;
      let lastDrawnIndex = -1;

      // Pad number to 3 digits (e.g., 1 -> '001')
      const getFrameSrc = (index) => `ezgif-frame-${String(index).padStart(3, '0')}.jpg`;

      // High-DPI canvas resizing
      function resizeCanvas() {
        const dpr = Math.max(window.devicePixelRatio || 1, 1);
        const w = window.innerWidth;
        const h = window.innerHeight;

        canvas.width = Math.round(w * dpr);
        canvas.height = Math.round(h * dpr);
        canvas.style.width = w + 'px';
        canvas.style.height = h + 'px';

        ctx.imageSmoothingEnabled = true;
        ctx.imageSmoothingQuality = 'high';
        
        // Re-render current frame on resize
        render(Math.round(currentFrameIndex), true);
      }

      window.addEventListener('resize', resizeCanvas, { passive: true });

      // Draw image with aspect-ratio cover (centered) with exact integer coordinates
      function drawCover(img) {
        const cw = canvas.width;
        const ch = canvas.height;
        const iw = img.naturalWidth || img.width;
        const ih = img.naturalHeight || img.height;

        if (!iw || !ih) return;

        ctx.imageSmoothingEnabled = true;
        ctx.imageSmoothingQuality = 'high';

        const scale = Math.max(cw / iw, ch / ih);
        const nw = Math.round(iw * scale);
        const nh = Math.round(ih * scale);
        const dx = Math.round((cw - nw) * 0.5);
        const dy = Math.round((ch - nh) * 0.5);

        ctx.drawImage(img, dx, dy, nw, nh);
      }

      // Render specific frame
      function render(frameIndex, force = false) {
        const clamped = Math.max(0, Math.min(FRAME_COUNT - 1, frameIndex));
        
        if (!force && clamped === lastDrawnIndex) return;

        const img = images[clamped];
        if (img && img.complete && (img.naturalWidth || img.width) > 0) {
          drawCover(img);
          lastDrawnIndex = clamped;
        } else if (lastDrawnIndex >= 0 && images[lastDrawnIndex]) {
          // If requested frame is still buffering, maintain existing frame
          drawCover(images[lastDrawnIndex]);
        }
      }

      // Preload images
      function preloadImages() {
        for (let i = 0; i < FRAME_COUNT; i++) {
          const img = new Image();
          if (i === 0) {
            img.fetchPriority = 'high';
          }
          img.decoding = 'async';
          img.src = getFrameSrc(i + 1);

          img.onload = () => {
            loadedImagesCount++;
            const activeFrame = Math.round(currentFrameIndex);
            if (activeFrame === i || (i === 0 && lastDrawnIndex === -1)) {
              render(activeFrame, true);
            }
          };

          images[i] = img;
        }
      }

      // Track scroll target
      function onScroll() {
        const maxScroll = document.documentElement.scrollHeight - window.innerHeight;
        if (maxScroll <= 0) return;
        const fraction = Math.max(0, Math.min(1, window.scrollY / maxScroll));
        targetFrameIndex = fraction * (FRAME_COUNT - 1);
      }

      window.addEventListener('scroll', onScroll, { passive: true });

      // Smooth interpolation animation loop
      function animate() {
        const diff = targetFrameIndex - currentFrameIndex;

        if (Math.abs(diff) > 0.0005) {
          // Smooth inertia lerp factor (0.09 provides an exceptionally smooth, cinematic feel)
          currentFrameIndex += diff * 0.09;
          render(Math.round(currentFrameIndex));
        }

        requestAnimationFrame(animate);
      }

      // Initialize
      resizeCanvas();
      preloadImages();
      onScroll();
      requestAnimationFrame(animate);
    })();
  </script>
</body>
</html>
